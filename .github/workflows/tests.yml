# Lance la suite de non-régression : elle ouvre Au Tableau dans un vrai
# navigateur, dessine, clique, exporte, et vérifie que ce qui marchait
# marche encore.
name: Tests

on:
  # Seulement « main ». Le même commit poussé aussi sur une branche de
  # travail déclencherait DEUX exécutions par modification — et donc deux
  # avis d'échec à chaque fois qu'une chose ne va pas.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Une poussée qui en suit une autre de près annule la précédente : inutile
# de tester un état déjà dépassé.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier le partage et le montage des séances
        run: node --test tests/publication-isolee.unit.cjs tests/montage-replay.unit.cjs tests/presse-papiers.unit.cjs tests/replay-mobile.unit.cjs tests/traces-fluides.unit.cjs

      # Playwright pilote le navigateur ; c'est la seule dépendance, et elle
      # ne concerne que les tests — le logiciel, lui, n'en charge aucune.
      - name: Installer Playwright et Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # Sans CHROMIUM_PATH, le socle prend le navigateur que Playwright vient
      # d'installer : c'est exactement ce qu'on veut ici.
      - name: Vérifier l’écriture sur un tableau chargé
        run: |
          node tests/run.cjs 73-traces-fluides
          node tests/run.cjs 66-stylet
          node tests/run.cjs 67-gomme
          node tests/run.cjs 02-persistance

      - name: Vérifier la stabilité du replay sur téléphone
        run: node tests/run.cjs 72-replay-mobile

      - name: Vérifier le cadrage et les raccourcis
        run: node tests/run.cjs 17-raccourcis

      - name: Vérifier le parcours de publication et de lecture
        run: node tests/run.cjs 69-rejouer

      - name: Vérifier le montage avant publication
        run: node tests/run.cjs 70-montage

      - name: Vérifier les collages du tableau et des applications extérieures
        run: node tests/run.cjs 71-presse-papiers

      - name: Conserver l’aperçu du montage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercu-montage
          path: test-artifacts/*.png

      - name: Lancer la suite
        run: node tests/run.cjs
